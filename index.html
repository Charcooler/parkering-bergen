<style>
/* Layout: kartet fyller skjermen; plassene ligger i et panel – nedtrekkbart ark på mobil, fast venstrekolonne på PC.
   Skiltblått (P-skilt) som aksent, statusfarger kun for ledig/fullt. */
:root {
  --bg: #eef2f5;
  --surface: #ffffff;
  --sunken: #e6ecf1;
  --ink: #14212b;
  --muted: #5a6b78;
  --line: #d6dee5;
  --sign: #0a4f9e;
  --sign-ink: #ffffff;
  --brick: #a8432f;
  --ok: #1d7f46;
  --some: #5f8a17;
  --low: #b46f08;
  --full: #b8322a;
  --stale: #7f8d99;
  --focus: #0a4f9e;
  --shadow: 0 6px 24px rgba(16, 33, 48, .16);
  --map-filter: none;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e161d; --surface: #16222c; --sunken: #101a22; --ink: #e6edf2; --muted: #93a4b1;
    --line: #26343f; --sign: #2f74c8; --sign-ink: #ffffff; --brick: #d3735d;
    --ok: #34b36a; --some: #8dbd33; --low: #e09a2f; --full: #e35d52; --stale: #66757f; --focus: #7fb2f0;
    --shadow: 0 6px 24px rgba(0, 0, 0, .5);
    --map-filter: brightness(.72) saturate(.85) contrast(1.06);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e161d; --surface: #16222c; --sunken: #101a22; --ink: #e6edf2; --muted: #93a4b1;
  --line: #26343f; --sign: #2f74c8; --sign-ink: #ffffff; --brick: #d3735d;
  --ok: #34b36a; --some: #8dbd33; --low: #e09a2f; --full: #e35d52; --stale: #66757f; --focus: #7fb2f0;
  --shadow: 0 6px 24px rgba(0, 0, 0, .5);
  --map-filter: brightness(.72) saturate(.85) contrast(1.06);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; overscroll-behavior: none; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; overflow: hidden; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sign); }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: .01em; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---------- skall ---------- */
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
header.top { background: var(--sign); color: var(--sign-ink); display: flex; align-items: center; gap: 12px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); z-index: 6; }
.psign { flex: none; width: 38px; height: 38px; border: 3px solid var(--sign-ink); border-radius: 7px; display: grid; place-items: center; font: 700 27px/1 var(--display); }
.brand { min-width: 0; flex: 1; }
.brand h1 { font-size: 22px; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand p { margin: 1px 0 0; font-size: 12.5px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.main { position: relative; min-height: 0; overflow: hidden; }
#map { position: absolute; inset: 0; background: var(--sunken); z-index: 0; }
.leaflet-container { font-family: var(--body); background: var(--sunken); }
.leaflet-image-layer { filter: var(--map-filter); }

.btn { border: 0; border-radius: 8px; padding: 9px 14px; font-weight: 600; cursor: pointer; background: var(--sunken); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; line-height: 1.2; }
.btn:hover { filter: brightness(.96); }
.btn.primary { background: var(--sign); color: var(--sign-ink); }
.btn.on-sign { background: var(--sign-ink); color: var(--sign); flex: none; }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.small { padding: 6px 10px; font-size: 13px; }
.btn.danger { color: var(--full); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.fab { position: absolute; z-index: 500; border: 1px solid var(--line); background: var(--surface); color: var(--ink); box-shadow: var(--shadow); border-radius: 10px; font-weight: 600; cursor: pointer; }
.locate { right: max(12px, env(safe-area-inset-right, 0px)); top: 12px; padding: 9px 12px; font-size: 14px; display: flex; gap: 6px; align-items: center; }
.locate svg { width: 18px; height: 18px; }

/* ---------- nåler på kartet ---------- */
.pin { --c: var(--stale); width: 30px; height: 30px; border-radius: 9px; background: var(--c); color: #fff; border: 2.5px solid #fff;
  display: grid; place-items: center; font: 700 15px/1 var(--display); box-shadow: 0 2px 6px rgba(0,0,0,.35); transition: transform .15s; }
.pin.phus { width: 36px; height: 36px; border-radius: 10px; font-size: 19px; }
.pin.live { font-size: 16px; padding: 0 6px; }
/* P-hus: blått P-hus-skilt; status vises som farget ring rundt */
.pin.phus { --c: #0a4f9e; background: #0a4f9e; color: #fff; border: 2.5px solid #fff; border-radius: 8px; gap: 3px; grid-auto-flow: column; }
.pin.phus .hus { font-size: 14px; font-weight: 600; opacity: .85; letter-spacing: .02em; }
.pin.phus.s-mye { box-shadow: 0 0 0 3px var(--ok), 0 2px 6px rgba(0,0,0,.35); }
.pin.phus.s-noe { box-shadow: 0 0 0 3px var(--some), 0 2px 6px rgba(0,0,0,.35); }
.pin.phus.s-lite { box-shadow: 0 0 0 3px var(--low), 0 2px 6px rgba(0,0,0,.35); }
.pin.phus.s-fullt { box-shadow: 0 0 0 3px var(--full), 0 2px 6px rgba(0,0,0,.35); }
.row .pin.phus { border-width: 0; }
.row .pin.live { width: auto; min-width: 44px; font-size: 15px; }
.ago.live { color: var(--ok); font-weight: 600; }
.pin.s-mye { --c: var(--ok); } .pin.s-noe { --c: var(--some); } .pin.s-lite { --c: var(--low); } .pin.s-fullt { --c: var(--full); }
.pin.sel { transform: scale(1.3); box-shadow: 0 0 0 4px var(--sign), 0 4px 12px rgba(0,0,0,.4); }
.me { width: 18px; height: 18px; border-radius: 50%; background: var(--sign); border: 3px solid #fff; box-shadow: 0 0 0 0 rgba(10,79,158,.5); }
@media (prefers-reduced-motion: no-preference) { .me { animation: pulse 2s infinite; } }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(47,116,200,.55); } 70% { box-shadow: 0 0 0 16px rgba(47,116,200,0); } 100% { box-shadow: 0 0 0 0 rgba(47,116,200,0); } }

.cross { position: absolute; left: 50%; z-index: 450; pointer-events: none; transform: translate(-50%, -100%); }
.cross svg { display: block; width: 40px; height: 52px; filter: drop-shadow(0 3px 4px rgba(0,0,0,.35)); }

/* ---------- panel / ark ---------- */
.panel { position: absolute; z-index: 600; background: var(--bg); display: flex; flex-direction: column; min-height: 0; }
.handle { display: none; }
.phead { flex: none; display: grid; gap: 10px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); background: var(--bg); }
.pbody { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 12px 16px calc(56px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; align-content: start; }
@media (min-width: 900px) {
  .panel { left: 0; top: 0; bottom: 0; width: 410px; border-right: 1px solid var(--line); box-shadow: var(--shadow); }
}
@media (max-width: 899.98px) {
  .panel { left: 0; right: 0; bottom: 0; border-radius: 16px 16px 0 0; box-shadow: 0 -6px 24px rgba(16,33,48,.18); transition: height .25s ease; height: 118px; }
  .panel[data-snap="half"] { height: 48%; }
  .panel[data-snap="peek"] .chips { display: none; }
  .panel[data-snap="peek"] .phead { border-bottom: 0; }
  .panel[data-snap="full"] { height: calc(100% - 8px); }
  .handle { display: grid; place-items: center; height: 22px; flex: none; cursor: grab; touch-action: none; border: 0; background: transparent; width: 100%; padding: 0; }
  .handle span { width: 42px; height: 5px; border-radius: 3px; background: var(--line); }
  .phead { padding-top: 0; gap: 8px; }
  .phead[id="headList"] { cursor: grab; }
  header.top { padding-block: 7px; gap: 10px; }
  .psign { width: 32px; height: 32px; border-width: 2.5px; font-size: 22px; }
  .brand h1 { font-size: 19px; }
  .btn.on-sign { padding: 7px 12px; }
  .phead, .pbody { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .leaflet-control-zoom { display: none; }
}

.summary { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; font-size: 14px; color: var(--muted); }
.summary b { color: var(--ink); font-variant-numeric: tabular-nums; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
.searchrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
input, select, textarea { width: 100%; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; }
.searchrow select { width: auto; max-width: 46vw; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }

<script>
(() => {
  /* ---------- faste data ---------- */
  const AREAS = [
    "Sentrum / Torgallmenningen", "Bryggen og Vågen", "Nordnes", "Nøstet", "Engen",
    "Marken", "Nygårdshøyden", "Møhlenpris", "Sydnes", "Fjellsiden",
    "Kalfaret", "Sandviken", "Skuteviken", "Lungegården / Bystasjonen", "Annet"
  ];
  // Offentlige parkeringshus (Bergen Parkering). «live» er nøkkelen i sanntidsdataene fra ledig-parkering.no.
  const GARAGES = [
    { id: "g-bygarasjen", name: "ByGarasjen", street: "Ved Bystasjonen", area: "Lungegården / Bystasjonen", lat: 60.38749, lng: 5.33124, count: 1792, live: "bygarasjen", hours: "Døgnåpent", note: "Elbillading på plan 2, mot Store Lungegårdsvann.", url: "https://bergenparkering.no/anlegg/bygarasjen/" },
    { id: "g-klostergarasjen", name: "KlosterGarasjen", street: "Vestre Murallmenningen 14", area: "Nøstet", lat: 60.39317, lng: 5.31657, count: 832, live: "klostergarasjen", hours: "Døgnåpent", note: "Elbillading på plan E og F. Gangutganger mot Strandkaien, Klosteret og Markeveien.", url: "https://bergenparkering.no/anlegg/klostergarasjen/" },
    { id: "g-grieggarasjen", name: "GriegGarasjen", street: "Lars Hilles gate 3 (under Grieghallen)", area: "Sentrum / Torgallmenningen", lat: 60.38956, lng: 5.32560, count: 363, live: "edvard", hours: "Døgnåpent", note: "Lading på plan U3. Høydegrense 2,05 m.", url: "https://bergenparkering.no/anlegg/grieggarasjen/" },
    { id: "g-nordnesgarasjen", name: "NordnesGarasjen", street: "Nordnesgaten 46", area: "Nordnes", lat: 60.39984, lng: 5.30531, count: null, hours: "Innkjøring 06–24", note: "Rett ved Akvariet. Elbillading.", url: "https://bergenparkering.no/anlegg/nordnesgarasjen/" },
  ].map((g) => ({ ...g, kind: "phus", builtin: true, zone: null }));

  const LEVELS = {
    mye:   { label: "Mye ledig",    rank: 4 },
    noe:   { label: "Noen ledige",  rank: 3 },
    lite:  { label: "Nesten fullt", rank: 2 },
    fullt: { label: "Fullt",        rank: 1 },
  };
  const FRESH_MS = 2 * 60 * 60 * 1000;
  const WINDOW_MS = 6 * 60 * 60 * 1000; // bare meldinger fra de siste 6 timene hentes (sparer lesinger)
  // Kartverket topo, satt sammen til bilder: hele området (zoom 15/16) og skarpere sentrum (zoom 17)
  const WIDE = [[60.362281, 5.273438], [60.419276, 5.377808]];
  const CENTER = [[60.378575, 5.295410], [60.404358, 5.353088]];
  const PEEK = 118;

  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const isDesktop = () => matchMedia("(min-width: 900px)").matches;

  const state = {
    spots: [], reports: [], loaded: false, notice: null,
    me: null, canWrite: true, canEdit: false, mode: "local", user: null, names: {},
    q: "", sort: "smart", kind: "alle", onlyFree: false,
    view: "list", selected: null, place: null, newLoc: null,
    myPos: null, showZones: true, kommune: [], ad: null, editAd: false, editCount: false, confirmDelete: false, sending: false,
  };

  /* ---------- lagring: claude.ai-database, Firebase eller bare nettleseren ---------- */
  const local = { data: Object.assign({ photos: [] }, lsGet("pb-data", { spots: [], reports: [] })), save() { lsSet("pb-data", this.data); emitLocal(); } };
  let db = null;
  function emitLocal() {
    state.spots = local.data.spots;
    state.reports = local.data.reports.filter((r) => Date.now() - r.at < WINDOW_MS);
    state.loaded = true; render();
  }
  const api = {
    async addSpot(s) {
      if (db) return (await db.collection("spots").add(s)).id;
      const id = uid(); local.data.spots.push({ id, ...s }); local.save(); return id;
    },
    async updateSpot(id, patch) {
      if (db) return db.doc("spots/" + id).update(patch);
      Object.assign(local.data.spots.find((x) => x.id === id), patch); local.save();
    },
    async deleteSpot(id) {
      if (db) return db.doc("spots/" + id).delete();
      local.data.spots = local.data.spots.filter((x) => x.id !== id);
      local.data.reports = local.data.reports.filter((r) => r.spotId !== id);
      local.data.photos = local.data.photos.filter((p) => p.spotId !== id); local.save();
    },
    async addReport(r) {
      if (db) return db.collection("reports").add(r);
      local.data.reports.unshift({ id: uid(), ...r }); local.data.reports = local.data.reports.slice(0, 400); local.save();
    },
    async addPhoto(p) {
      if (db) return db.collection("photos").add(p);
      local.data.photos.push({ id: uid(), ...p });
      try { localStorage.setItem("pb-data", JSON.stringify(local.data)); } catch { local.data.photos.pop(); throw { code: "quota_exceeded" }; }
      loadPhotos(p.spotId); emitLocal();
    },
    async deletePhoto(id) {
      if (db) return db.doc("photos/" + id).delete();
      local.data.photos = local.data.photos.filter((x) => x.id !== id); lsSet("pb-data", local.data); loadPhotos(state.selected); emitLocal();
    },
    async setAd(a) {
      if (db) return db.doc("config/ad").set(a);
      lsSet("pb-ad", a); state.ad = a; render();
    },
  };

  async function boot() {
    const use = window.claude && window.claude.use;
    if (!use) { if (!(await startFirebase())) localMode(); return; }
    const [d, user] = await Promise.all([use("db").catch(() => null), use("user").catch(() => null)]);
    if (!d) { localMode(); return; }
    db = d; state.mode = "db";
    if (user) {
      state.user = user;
      state.me = await user.id().catch(() => null);
      state.canWrite = (await user.can("data.write").catch(() => null)) !== false;
      state.canEdit = await user.canEdit().catch(() => false);
    }
    if (!state.canWrite) state.notice = "Du kan se plassene, men ikke legge inn eller melde. Be eieren om tilgang som bidragsyter.";
    db.doc("config/ad").onSnapshot((snap) => { state.ad = snap.exists ? snap.data() : null; render(); }, () => {});
    subscribe(); render();
  }
  function subscribe() {
    db.collection("spots").limit(1000).onSnapshot((snap) => {
      state.spots = snap.docs.map((x) => ({ id: x.id, ...x.data() })); state.loaded = true; resolveNames(); render();
    }, onDbError);
    db.collection("reports").where("at", ">", Date.now() - WINDOW_MS).orderBy("at", "desc").limit(300).onSnapshot((snap) => {
      state.reports = snap.docs.map((x) => ({ id: x.id, ...x.data() })); resolveNames(); render();
    }, onDbError);
  }
  const loadScript = (src) => new Promise((ok, fail) => {
    const el = document.createElement("script"); el.src = src; el.onload = ok; el.onerror = fail; document.head.appendChild(el);
  });
  async function startFirebase() {
    try { await loadScript("config.js"); } catch { return false; }
    const cfg = window.PARKERING_CONFIG || {};
    if (!cfg.firebase || !cfg.firebase.apiKey) return false;
    state.ad = cfg.ad && cfg.ad.text ? cfg.ad : null;
    try {
      const base = "https://cdn.jsdelivr.net/npm/firebase@10.12.2/";
      await loadScript(base + "firebase-app-compat.js");
      await Promise.all([loadScript(base + "firebase-auth-compat.js"), loadScript(base + "firebase-firestore-compat.js")]);
      firebase.initializeApp(cfg.firebase);
      state.me = (await firebase.auth().signInAnonymously()).user.uid;
      db = firebase.firestore(); state.mode = "db";
      subscribe(); render();
      return true;
    } catch (e) {
      console.error(e);
      state.notice = "Fikk ikke kontakt med den felles databasen. Det du legger inn lagres bare på denne enheten.";
      return false;
    }
  }
  function localMode() {
    state.mode = "local"; state.canEdit = true; state.ad = lsGet("pb-ad", null);
    state.notice = state.notice || "Det du legger inn lagres bare på denne enheten.";
    emitLocal();
  }
  function onDbError(e) { state.notice = "Mistet kontakten med den felles oversikten (" + ((e && e.code) || "ukjent feil") + "). Last siden på nytt."; render(); }

  async function resolveNames() {
    if (!state.user) return;
    const ids = new Set();
    state.spots.forEach((s) => s.by && ids.add(s.by));
    state.reports.forEach((r) => r.by && ids.add(r.by));
    const missing = [...ids].filter((i) => !(i in state.names)).slice(0, 64);
    if (!missing.length) return;
    missing.forEach((i) => (state.names[i] = ""));
    try { const ps = await state.user.profiles(missing); for (const i of missing) state.names[i] = (ps[i] && ps[i].name) || ""; render(); } catch {}
  }
  const who = (id) => (state.mode === "local" || (id && id === state.me)) ? "deg" : (state.names[id] || "en bruker");

  /* ---------- avledet tilstand ---------- */
  const allSpots = () => [...GARAGES, ...state.kommune, ...state.spots.map((s) => ({ kind: "gate", ...s }))];
  const byId = (id) => allSpots().find((s) => s.id === id);
  const hasLoc = (s) => typeof s.lat === "number" && typeof s.lng === "number";
  const latestFor = (id) => state.reports.find((r) => r.spotId === id) || null;
  const isFresh = (r) => !!r && Date.now() - r.at < FRESH_MS;
  const freshLevel = (s) => { const g = liveFor(s); if (g) return liveLevel(g); const r = latestFor(s.id); return isFresh(r) ? r.level : null; };

  /* ---------- sanntid fra Bergen Parkering ----------
     Samme kilde som bergenparkering.no bruker. Virker på egen nettside; claude.ai stenger for kall til andre nettsteder. */
  const LIVE_URL = "https://ledig-parkering.no/wp-json/lpark/v1/live";
  const LIVE_MAX_AGE = 5 * 60 * 1000;
  async function fetchLive() {
    if (document.hidden) return;
    try {
      const res = await fetch(LIVE_URL, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const p = await res.json(), at = Date.parse(p.fetched_at);
      state.live = !p.stale && p.garages && Date.now() - at < LIVE_MAX_AGE ? { at, garages: p.garages } : null;
    } catch { state.live = null; }
    render();
  }
  function liveFor(s) {
    if (!s.live || !state.live) return null;
    const g = state.live.garages[s.live];
    return g && !g.unavailable && typeof g.free_spaces === "number" ? g : null;
  }
  function liveLevel(g) {
    if (g.free_spaces <= 0) return "fullt";
    const share = g.capacity_spaces ? g.free_spaces / g.capacity_spaces : 0.5;
    return share >= 0.3 ? "mye" : share >= 0.1 ? "noe" : "lite";
  }
  const fmtInt = (n) => Number(n).toLocaleString("nb-NO");
  function ago(t) {
    const m = Math.round((Date.now() - t) / 60000);
    if (m < 1) return "nå nettopp";
    if (m < 60) return m + " min siden";
    const h = Math.floor(m / 60);
    return h + " t" + (m % 60 ? " " + (m % 60) + " min" : "") + " siden";
  }
  const clock = (t) => new Date(t).toLocaleTimeString("nb-NO", { hour: "2-digit", minute: "2-digit" });
  function distance(a, b) {
    const R = 6371000, rad = Math.PI / 180, dLat = (b[0] - a[0]) * rad, dLng = (b[1] - a[1]) * rad;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * rad) * Math.cos(b[0] * rad) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  const distTo = (s) => state.myPos && hasLoc(s) ? distance(state.myPos, [s.lat, s.lng]) : null;
  const fmtDist = (m) => m < 1000 ? Math.max(10, Math.round(m / 10) * 10) + " m" : (m / 1000).toFixed(1).replace(".", ",") + " km";
  const walk = (m) => Math.max(1, Math.round(m / 80)) + " min å gå";
  const navUrl = (s) => hasLoc(s)
    ? "https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=" + s.lat.toFixed(5) + "," + s.lng.toFixed(5)
    : "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent((s.street || s.name) + ", Bergen");

  function filtered() {
    const q = state.q.trim().toLowerCase();
    return allSpots().filter((s) => {
      if (state.kind === "soner") return false;
      if (state.kind === "avgift" && !s.kommunal) return false;
      if (state.kind === "gate" && (s.kommunal || s.kind !== "gate")) return false;
      if (state.kind === "phus" && s.kind !== "phus") return false;
      if (q && ![s.name, s.street, s.zone, s.note, s.area].join(" ").toLowerCase().includes(q)) return false;
      if (state.onlyFree) { const l = freshLevel(s); if (!l || LEVELS[l].rank < 3) return false; }
      return true;
    });
  }
  function sorted(list) {
    const mode = state.sort === "smart" ? (state.myPos ? "near" : "free") : state.sort;
    const free = (s) => {
      const g = liveFor(s); if (g) return LEVELS[liveLevel(g)].rank * 1e13 + state.live.at;
      const r = latestFor(s.id); return isFresh(r) ? LEVELS[r.level].rank * 1e13 + r.at : (r ? r.at / 1e3 : 0);
    };
    const cmp = {
      near: (a, b) => (distTo(a) ?? Infinity) - (distTo(b) ?? Infinity),
      free: (a, b) => free(b) - free(a) || a.name.localeCompare(b.name, "nb"),
      recent: (a, b) => ((latestFor(b.id) || {}).at || 0) - ((latestFor(a.id) || {}).at || 0),
      area: (a, b) => AREAS.indexOf(a.area) - AREAS.indexOf(b.area) || a.name.localeCompare(b.name, "nb"),
    }[mode];
    return [...list].sort(cmp);
  }

  /* ---------- boligsoner (Bergen kommune, Boligsonekart) ---------- */
  let ZONES = null;
  function inRing(lat, lng, ring) {
    let inside = false;
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      const [xi, yi] = ring[i], [xj, yj] = ring[j];
      if ((yi > lat) !== (yj > lat) && lng < (xj - xi) * (lat - yi) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  }
  function inGeom(lat, lng, g) {
    const polys = g.type === "MultiPolygon" ? g.coordinates : [g.coordinates];
    return polys.some((p) => inRing(lat, lng, p[0]) && !p.slice(1).some((h) => inRing(lat, lng, h)));
  }
  // avstand i meter fra et punkt til nærmeste sonegrense
  function edgeDist(lat, lng, g) {
    const k = Math.cos(lat * Math.PI / 180), M = 111320;
    let best = Infinity;
    const polys = g.type === "MultiPolygon" ? g.coordinates : [g.coordinates];
    for (const p of polys) for (const ring of p) for (let i = 1; i < ring.length; i++) {
      const ax = (ring[i - 1][0] - lng) * k * M, ay = (ring[i - 1][1] - lat) * M, bx = (ring[i][0] - lng) * k * M, by = (ring[i][1] - lat) * M;
      const dx = bx - ax, dy = by - ay, t = Math.max(0, Math.min(1, -(ax * dx + ay * dy) / (dx * dx + dy * dy || 1)));
      best = Math.min(best, Math.hypot(ax + t * dx, ay + t * dy));
    }
    return best;
  }
  // soner man er i eller står helt inntil (grensegater kan være skiltet for begge)
  const zonesNear = (lat, lng, m = 25) => ZONES ? ZONES.soner.filter((z) => inGeom(lat, lng, z.geo) || edgeDist(lat, lng, z.geo) < m) : [];
  // sonekort fra andre soner som også gjelder her (kommunen: sone 1 gjelder også i 2 og 3)
  const alsoValidHere = (z) => ZONES ? ZONES.soner.filter((o) => o !== z && o.sonekort && new RegExp("\\b" + z.sone + "\\b").test(o.sonekort.replace(/^.*?parkere i/, ""))) : [];
  const zoneAt = (lat, lng) => ZONES && ZONES.soner.find((z) => inGeom(lat, lng, z.geo)) || null;
  const zoneOf = (s) => hasLoc(s) ? zoneAt(s.lat, s.lng) : null;
  const zoneExtra = (z) => [z.sonekort, ...alsoValidHere(z).map((o) => `Beboere med sonekort for sone ${o.sone} kan også parkere her.`)].filter(Boolean).join(" ");
  const zoneText = (z) => z.besok
    ? "Besøkende betaler 24 kr i timen (360 kr per døgn) i appen «P i Bergen» eller på automat. Gratis på kveld, natt og søndag."
    : "Gateplassene er bare for beboere med sonekort. Bruk en avgiftsplass eller et P-hus.";
  const zoneBadge = (s) => {
    if (s.zone) return s.zone;
    if (!hasLoc(s) || !ZONES) return null;
    const zs = zonesNear(s.lat, s.lng, 20).map((z) => z.sone).sort((a, b) => a - b);
    return zs.length ? "sone " + zs.join(" og ") : null;
  };

  /* ---------- tegning ---------- */
  function render() {
    for (const v of ["List", "Detail", "Place", "Form"]) {
      const on = state.view === v.toLowerCase();
      const h = $("#head" + v), b = $("#body" + v);
      if (h) h.hidden = !on;
      if (b) b.hidden = !on;
    }
    $("#cross").hidden = state.view !== "place";
    $("#addBtn").hidden = !state.canWrite;
    if (state.view === "list") renderList();
    if (state.view === "detail") renderDetail();
    renderMap();
  }

  // bredde på nålen for P-hus med sanntidstall
  const pinWidth = (s) => { const g = liveFor(s); return g ? Math.max(44, 30 + String(g.free_spaces).length * 9) : (s.kind === "phus" ? 36 : 30); };
  function pinHtml(s, extraClass = "", width) {
    const g = liveFor(s);
    if (g) return `<div class="pin phus live s-${liveLevel(g)} ${extraClass}"${width ? ` style="width:${width}px"` : ""}><span>P</span><span class="hus">${esc(g.free_spaces)}</span></div>`;
    const r = latestFor(s.id), fresh = isFresh(r);
    const label = fresh && r.free != null && r.free < 100 ? r.free : "P";
    const lbl = s.kommunal && label === "P" ? "kr" : label;
    return `<div class="pin ${s.kind === "phus" ? "phus" : ""} ${s.kommunal ? "avg" : ""} ${fresh ? "s-" + r.level : ""} ${extraClass}">${esc(lbl)}</div>`;
  }
  function statusPill(s) {
    const g = liveFor(s);
    if (g) return `<span class="pill ${liveLevel(g)}">${fmtInt(g.free_spaces)} ledige</span><span class="ago live">● Sanntid</span>`;
    const r = latestFor(s.id);
    if (!r) return `<span class="pill none">Ingen melding</span>`;
    const fresh = isFresh(r);
    return `<span class="pill ${fresh ? r.level : ""}">${fresh ? esc(LEVELS[r.level].label) : "Utdatert"}</span><span class="ago">${esc(ago(r.at))}</span>`;
  }
  function row(s) {
    const d = distTo(s);
    const sub = [
      s.kind === "phus" ? "P-hus" : s.kommunal ? `Avgiftsplass${zoneBadge(s) ? ` · <span class="zone">${esc(zoneBadge(s))}</span>` : ""}` : (zoneBadge(s) ? `<span class="zone">${esc(zoneBadge(s))}</span>` : "Gate"),
      liveFor(s) ? `${fmtInt(liveFor(s).capacity_spaces)} plasser` : (s.count ? `ca. ${fmtInt(s.count)} plasser` : ""),
      d != null ? fmtDist(d) : "",
    ].filter(Boolean).map((x) => `<span>${x}</span>`).join("");
    return `<button class="row" type="button" data-id="${esc(s.id)}">
      ${pinHtml(s)}
      <span class="row-main"><b>${esc(s.name)}</b><span class="row-sub">${sub}</span></span>
      <span class="row-status">${statusPill(s)}</span>
    </button>`;
  }

  function renderList() {
    const spots = allSpots();
    const fresh = spots.map(freshLevel).filter(Boolean);
    const n = (l) => fresh.filter((x) => l.includes(x)).length;
    $("#summary").innerHTML = `<span><b>${spots.length}</b> plasser</span>
      <span><i class="dot" style="background:var(--ok)"></i><b>${n(["mye", "noe"])}</b> ledig nå</span>
      <span><i class="dot" style="background:var(--low)"></i><b>${n(["lite"])}</b> nesten fullt</span>
      <span><i class="dot" style="background:var(--full)"></i><b>${n(["fullt"])}</b> fullt</span>`;
    document.querySelectorAll(".chip[data-kind]").forEach((c) => c.setAttribute("aria-pressed", String(c.dataset.kind === state.kind)));
    $("#freeChip").setAttribute("aria-pressed", String(state.onlyFree));

    const parts = [];
    if (state.notice) parts.push(`<div class="notice">${esc(state.notice)}</div>`);

    // hvilken sone står jeg i?
    if (state.myPos && ZONES) {
      const z = zoneAt(state.myPos[0], state.myPos[1]);
      const near = zonesNear(state.myPos[0], state.myPos[1]).filter((o) => o !== z);
      parts.push(z ? `<div class="zonecard ${z.besok ? "vis" : "res"}"><b>Du er i sone ${esc(z.sone)} ${esc(z.navn)}</b><span>${esc(zoneText(z))}</span>${zoneExtra(z) ? `<span>${esc(zoneExtra(z))}</span>` : ""}${near.length ? `<span><b style="font-size:14px">Grense mot sone ${near.map((o) => esc(o.sone)).join(" og ")}.</b> Gaten kan være skiltet for begge sonene – sjekk skiltet.</span>` : ""}</div>`
        : `<div class="zonecard"><b>Du er utenfor boligsonene</b><span>Sjekk skiltet der du parkerer.</span></div>`);
    }
    parts.push(adHtml());
    parts.push(`<div class="legend"><span><i style="background:#ffd21f;color:#14212b;border:2px solid #14212b">kr</i>Avgiftsplass – alle kan betale</span><span><i style="background:#0a4f9e;color:#fff">P</i>P-hus (tall = ledige nå)</span><span><i style="background:var(--stale);color:#fff">P</i>Meldt inn av brukere</span><span>Fargede felt = boligsoner</span></div>`);

    // står du ved en plass? foreslå å melde status
    if (state.myPos && state.canWrite) {
      const near = spots.filter((s) => hasLoc(s) && !liveFor(s)).map((s) => [s, distTo(s)]).filter(([, d]) => d < 150).sort((a, b) => a[1] - b[1])[0];
      if (near) parts.push(`<div class="nearby"><p>Står du ved ${esc(near[0].name)}? Hjelp andre og meld hvor mye som er ledig.</p>
        <button class="btn small" type="button" data-open="${esc(near[0].id)}">Meld status</button></div>`);
    }

    if (state.kind === "soner") {
      const zs = ZONES ? [...ZONES.soner] : [];
      const here = state.myPos && zoneAt(state.myPos[0], state.myPos[1]);
      zs.sort((a, b) => (here && a === here ? -1 : here && b === here ? 1 : 0) || a.sone - b.sone);
      parts.push(`<div class="rows">${zs.map((z) => `<button class="row" type="button" data-zone="${esc(z.sone)}">
        <div class="pin" style="--c:${zoneColor[z.sone] || "var(--stale)"};border-radius:50%">${esc(z.sone)}</div>
        <span class="row-main"><b>Sone ${esc(z.sone)} ${esc(z.navn)}</b><span class="row-sub"><span>${z.besok ? "Besøkende betaler 24 kr/t" : "Bare beboere med sonekort"}</span>${here === z ? "<span>Du er her</span>" : ""}</span></span>
        <span class="row-status"><span class="pill ${z.besok ? "noe" : "fullt"}">${z.besok ? "Besøkende OK" : "Beboere"}</span></span>
      </button>`).join("")}</div>`);
      parts.push(zoneInfo());
      const body = $("#bodyList"); const st = body.scrollTop; body.innerHTML = parts.join(""); body.scrollTop = st;
      return;
    }
    const list = sorted(filtered());
    if (!state.loaded) parts.push(`<p class="foot">Henter plasser fra den felles oversikten …</p>`);
    if (!list.length) {
      parts.push(`<div class="empty"><h2>Ingen treff</h2><p>Prøv et annet søk eller fjern filteret «Ledig nå».</p></div>`);
    } else if (state.sort === "area") {
      const groups = AREAS.map((a) => [a, list.filter((s) => (AREAS.includes(s.area) ? s.area : "Annet") === a)]).filter(([, l]) => l.length);
      for (const [a, l] of groups) parts.push(`<div class="group-title"><span>${esc(a)}</span><span>${l.length}</span></div><div class="rows">${l.map(row).join("")}</div>`);
    } else {
      parts.push(`<div class="rows">${list.map(row).join("")}</div>`);
    }
    if (state.loaded && !state.spots.length && state.canWrite) {
      parts.push(`<div class="empty"><h2>Mangler det en plass?</h2>
        <p>P-husene og kommunens avgiftsplasser ligger inne. Vet du om en plass som mangler, trykk «+ Legg til», flytt nålen dit den er, og skriv ca. hvor mange plasser det er.</p>
        <button class="btn primary" type="button" data-act="add">+ Legg til en plass</button></div>`);
    }
    parts.push(zoneInfo());
    parts.push(`<p class="foot">Opplysningene er meldt inn av brukere og kan være feil. Skiltet på stedet gjelder alltid. Meldinger eldre enn 2 timer vises som utdatert, og eldre enn 6 timer vises ikke. Kart: © Kartverket.</p>`);

    const body = $("#bodyList");
    if (state.editAd && body.querySelector("#adForm")) return; // ikke tegn over annonseskjemaet mens det fylles ut
    const info = body.querySelector("details.info");
    const wasOpen = info && info.open;
    const st = body.scrollTop; body.innerHTML = parts.join(""); body.scrollTop = st;
    if (wasOpen) body.querySelector("details.info").open = true;
  }

  function adHtml() {
    const a = state.ad;
    const url = a && /^https?:\/\//i.test(a.url || "") ? a.url : null;
    const body = a && a.text
      ? (url ? `<a class="txt" href="${esc(url)}" target="_blank" rel="noopener sponsored">${esc(a.text)}</a>` : `<span class="txt">${esc(a.text)}</span>`)
      : `<span class="txt placeholder">Annonser her og nå bilistene i Bergen sentrum</span>`;
    const edit = state.canEdit ? `<button class="btn ghost small" type="button" data-act="ad-edit">${state.editAd ? "Lukk" : "Rediger"}</button>` : "";
    const form = state.editAd ? `<form class="ad-edit" id="adForm">
        <input id="ad-text" maxlength="90" placeholder="Annonsetekst (én linje)" value="${esc((a && a.text) || "")}" aria-label="Annonsetekst">
        <input id="ad-url" maxlength="300" placeholder="https://… (valgfri lenke)" value="${esc((a && a.url) || "")}" aria-label="Lenke">
        <button class="btn primary small" type="submit">Lagre</button>
        <button class="btn ghost small" type="button" data-act="ad-clear">Fjern</button>
      </form>` : "";
    return `<aside class="ad" aria-label="Annonse"><span class="tag">Annonse</span>${body}${edit}${form}</aside>`;
  }

  function zoneInfo() {
    return `<details class="info">
      <summary>Slik fungerer parkeringssonene i Bergen</summary>
      <ul>

  function insidePoint(g) {
    const ring = (g.type === "MultiPolygon" ? g.coordinates.reduce((a, b) => (b[0].length > a[0].length ? b : a)) : g.coordinates)[0];
    const xs = ring.map((p) => p[0]), ys = ring.map((p) => p[1]);
    const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
    let best = null, bestD = -1;
    for (let i = 1; i < 20; i++) for (let j = 1; j < 20; j++) {
      const x = x0 + (x1 - x0) * i / 20, y = y0 + (y1 - y0) * j / 20;

      let d = Infinity;
      for (const [px, py] of ring) d = Math.min(d, Math.hypot((px - x) * 0.5, py - y));

  $("#lbDel").addEventListener("click", async (e) => {
    const b = e.currentTarget;
    if (b.textContent !== "Ja, slett") { b.textContent = "Ja, slett"; return; }
    try { await api.deletePhoto(b.dataset.id); $("#lightbox").hidden = true; toast("Bildet er slettet."); } catch (er) { fail(er); }
  });
  document.addEventListener("change", async (e) => {
    if (e.target.id === "d-photo") { const f = e.target.files[0]; e.target.value = ""; if (f && state.selected) await uploadPhoto(state.selected, f); }
    if (e.target.id === "f-photo") { const f = e.target.files[0]; $("#f-photo-name").textContent = f ? "✓ " + f.name : ""; }
  });

  function backToList() { loadPhotos(null); state.view = "list"; state.selected = null; render(); }

  function startPlace(p) {
    if (!map) { toast("Kartet er ikke tilgjengelig."); return; }
    state.place = p; state.view = "place";
    $("#placeText").textContent = p.kind === "me" ? "Flytt kartet så nålen står der du er" : "Flytt kartet så nålen står der plassen er";
    $("#placeOk").textContent = p.kind === "me" ? "Her er jeg" : "Bruk denne plasseringen";
    render(); setSnap("peek");
    const target = p.kind === "move" ? byId(p.id) : null;
    setTimeout(() => {
      placeCross();
      if (target && hasLoc(target)) showOnMap([target.lat, target.lng], 17);
      else if (p.kind === "new" && state.newLoc) showOnMap(state.newLoc, 17);
      else if (p.kind === "new" && state.myPos) showOnMap(state.myPos, 17);
    }, 280);
  }
  function confirmPlace() {
    const ll = map.containerPointToLatLng(crossPoint());
    const pos = [Number(ll.lat.toFixed(6)), Number(ll.lng.toFixed(6))];
    const p = state.place; state.place = null;
    if (p.kind === "me") { state.view = "list"; setMyPos(pos, false); toast("Sortert etter avstand fra deg."); return; }
    if (p.kind === "new") { state.newLoc = pos; showLoc(); const zs = zonesNear(pos[0], pos[1], 20).map((z) => z.sone).sort((a, b) => a - b); if (zs.length && !$("#f-zone").value) $("#f-zone").value = "sone " + zs.join(" og "); state.view = "form"; render(); setSnap("full"); setTimeout(() => $("#f-name").focus(), 280); return; }
    api.updateSpot(p.id, { lat: pos[0], lng: pos[1] }).then(() => toast("Plasseringen er lagret."), fail);
    openSpot(p.id);
  }
  function cancelPlace() {
    const p = state.place; state.place = null;
    if (p && p.fromForm) { state.view = "form"; render(); setSnap("full"); return; }
    if (p && p.kind === "move") { openSpot(p.id); return; }
    backToList();
  }

  function startAdd() {
    if (!state.canWrite) { toast("Du har bare lesetilgang."); return; }
    $("#spotForm").reset(); $("#spotErr").hidden = true; state.newLoc = null; showLoc();
    startPlace({ kind: "new" });
  }
  function showLoc() {
    $("#f-loc").innerHTML = state.newLoc ? '<span class="ok">✓ Plassert på kartet</span>' : "Ikke plassert på kartet";
    $("#f-pick").textContent = state.newLoc ? "Endre" : "Velg på kartet";
  }

  async function sendReport(level) {
    const s = byId(state.selected); if (!s || state.sending) return;
    const fv = (($("#r-free") || {}).value || "").trim(), cm = (($("#r-comment") || {}).value || "").trim();
    const rep = { spotId: s.id, level, at: Date.now(), by: state.me || null, free: fv === "" ? null : Math.max(0, Math.round(Number(fv))), comment: cm || null };
    state.sending = true; render();
    try {
      await api.addReport(rep);
      for (const k of ["r-free", "r-comment"]) { const el = document.getElementById(k); if (el) el.value = ""; }
      toast("Takk! «" + LEVELS[level].label + "» er meldt.");
    } catch (e) { fail(e); }
    finally { state.sending = false; render(); }
  }

  /* ---------- min posisjon ---------- */
  function setMyPos(ll, pan = true) {
    state.myPos = ll;
    if (map) {
      if (meMarker) meMarker.remove();
      meMarker = L.marker(ll, { icon: L.divIcon({ className: "", html: '<div class="me"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }), interactive: false, zIndexOffset: 2000 }).addTo(map);
      if (!L.latLngBounds(WIDE).contains(ll)) toast("Du er utenfor kartet. Avstandene stemmer likevel.");
      else if (pan) showOnMap(ll, 16);
    }
    render();
  }
  function locate() {
    const fallback = (msg) => { toast(msg); startPlace({ kind: "me" }); };
    if (!navigator.geolocation) { fallback("GPS er ikke tilgjengelig her. Vis på kartet hvor du er."); return; }
    $("#locateBtn").disabled = true; $("#locateTxt").textContent = "Finner deg …";
    const done = () => { $("#locateBtn").disabled = false; $("#locateTxt").textContent = "Min posisjon"; };
    navigator.geolocation.getCurrentPosition(
      (p) => { done(); setMyPos([p.coords.latitude, p.coords.longitude]); toast("Sortert etter avstand fra deg."); },
      () => { done(); fallback("Fikk ikke tak i GPS-en. Vis på kartet hvor du er."); },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
    );
  }

  let toastT;
  function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (el.hidden = true), 2600); }
  function fail(e) { toast(e && e.code === "quota_exceeded" ? "Oversikten er full. Slett gamle plasser først." : "Fikk ikke lagret. Sjekk nettet og prøv igjen."); }

  document.addEventListener("click", async (ev) => {
    const t = ev.target;
    const rowEl = t.closest(".row[data-id]"); if (rowEl) { openSpot(rowEl.dataset.id); return; }
    const zr = t.closest("[data-zone]");
    if (zr && zoneGeo[zr.dataset.zone]) {
      const g = zoneGeo[zr.dataset.zone];
      if (!isDesktop()) setSnap("peek");
      setTimeout(() => { map.fitBounds(g.getBounds(), isDesktop() ? { paddingTopLeft: [430, 20], paddingBottomRight: [20, 20] } : { paddingBottomRight: [0, PEEK + 20], paddingTopLeft: [20, 20] }); g.openPopup(g.getBounds().getCenter()); }, isDesktop() ? 0 : 280);
      return;
    }
    const op = t.closest("[data-open]"); if (op) { openSpot(op.dataset.open); return; }
    const kindChip = t.closest(".chip[data-kind]");
    if (kindChip) {
      state.kind = kindChip.dataset.kind;
      if (state.kind === "soner" && !state.showZones) { state.showZones = true; $("#zoneChip").setAttribute("aria-pressed", "true"); syncZones(); }
      render(); return;
    }
    const ph = t.closest("[data-photo]"); if (ph) { const p = (state.photos || []).find((x) => x.id === ph.dataset.photo); if (p) openLightbox(p); return; }
    const lv = t.closest(".level[data-level]"); if (lv) { sendReport(lv.dataset.level); return; }
    const a = t.closest("[data-act]"); if (!a) return;
    const s = byId(state.selected);
    switch (a.dataset.act) {
      case "add": startAdd(); break;
      case "back": backToList(); break;
      case "count": state.editCount = !state.editCount; render(); break;
      case "count-save": {
        const v = Math.round(Number($("#c-count").value));
        if (!(v > 0)) { toast("Skriv et antall over 0."); return; }
        try { await api.updateSpot(s.id, { count: v }); state.editCount = false; render(); toast("Antall plasser er oppdatert."); } catch (e) { fail(e); }
        break;
      }
      case "move": startPlace({ kind: "move", id: s.id }); break;
      case "del": state.confirmDelete = true; render(); break;
      case "del-no": state.confirmDelete = false; render(); break;
      case "del-yes": try { await api.deleteSpot(s.id); backToList(); toast("Plassen er slettet."); } catch (e) { fail(e); } break;
      case "ad-edit": state.editAd = !state.editAd; $("#bodyList").innerHTML = ""; render(); break;
      case "ad-clear": try { await api.setAd({ text: null, url: null }); state.editAd = false; $("#bodyList").innerHTML = ""; render(); toast("Annonsen er fjernet."); } catch (e) { fail(e); } break;
    }
  });
  document.addEventListener("submit", async (e) => {
    if (e.target.id !== "adForm") return;
    e.preventDefault();
    const text = $("#ad-text").value.trim(), url = $("#ad-url").value.trim();
    if (url && !/^https?:\/\//i.test(url)) { toast("Lenken må starte med https://"); return; }
    try { await api.setAd({ text: text || null, url: url || null }); state.editAd = false; $("#bodyList").innerHTML = ""; render(); toast("Annonsen er lagret."); } catch (er) { fail(er); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (!$("#lightbox").hidden) { $("#lightbox").hidden = true; return; }
    if (state.view === "place") cancelPlace(); else if (state.view === "detail" || state.view === "form") backToList();
  });

  $("#addBtn").addEventListener("click", startAdd);
  $("#locateBtn").addEventListener("click", locate);
  $("#placeOk").addEventListener("click", confirmPlace);
  $("#placeCancel").addEventListener("click", cancelPlace);
  $("#formBack").addEventListener("click", () => { backToList(); setSnap("peek"); });
  $("#f-pick").addEventListener("click", () => startPlace({ kind: "new", fromForm: true }));
  $("#zoneChip").addEventListener("click", (e) => { state.showZones = !state.showZones; e.currentTarget.setAttribute("aria-pressed", String(state.showZones)); syncZones(); });
  $("#freeChip").addEventListener("click", () => { state.onlyFree = !state.onlyFree; render(); });
  $("#q").addEventListener("input", (e) => { state.q = e.target.value; render(); });
  $("#q").addEventListener("focus", () => { if (!isDesktop()) setSnap("full"); });
  $("#sort").addEventListener("change", (e) => { state.sort = e.target.value; if (state.sort === "near" && !state.myPos) locate(); render(); });
  $("#f-area").innerHTML = AREAS.map((a) => `<option>${esc(a)}</option>`).join("");
  $("#spotForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = $("#f-name").value.trim(), err = $("#spotErr");
    if (!name) { err.textContent = "Gi plassen et navn, for eksempel gaten den ligger i."; err.hidden = false; $("#f-name").focus(); return; }
    if (!state.newLoc) { err.textContent = "Vis hvor plassen er: trykk «Velg på kartet»."; err.hidden = false; return; }
    const c = Math.round(Number($("#f-count").value));
    const spot = {
      name, kind: $("#f-kind").value, street: $("#f-street").value.trim() || null, area: $("#f-area").value,
      zone: $("#f-zone").value.trim() || null, count: c > 0 ? c : null, note: $("#f-note").value.trim() || null,
      by: state.me || null, at: Date.now(), lat: state.newLoc[0], lng: state.newLoc[1],
    };
    $("#spotSave").disabled = true;
    try {
      const id = await api.addSpot(spot); toast("Plassen er lagt til. Takk!"); state.newLoc = null;
      const file = $("#f-photo").files[0]; $("#f-photo").value = ""; $("#f-photo-name").textContent = "";
      if (id) { openSpot(id); if (file) await uploadPhoto(id, file); } else backToList();
    }
    catch (er) { fail(er); }
    finally { $("#spotSave").disabled = false; }
  });
  addEventListener("resize", () => { if (state.view === "place") placeCross(); });

  initMap();
  render();
  setInterval(render, 60000); // oppdater «x min siden»
  boot();
  if (!(window.claude && window.claude.use)) {
    fetchLive(); setInterval(fetchLive, 45000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) fetchLive(); });
  }
})();
</script>

</body>
</html>
